[project]
name = "asda"
version = "1.0.0"
description = "Autonomous Sales Development Agent — modular, self-hostable SDR system"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sidharth" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy>=2.0.36",
  "python-multipart>=0.0.12",
  "httpx>=0.27.0",
  "openai>=1.59.0",
  "langgraph>=0.2.60",
  "typer>=0.15.0",
  "rich>=13.9.0",
  "python-dotenv>=1.0.1",
  "streamlit>=1.40.0",
  "pandas>=2.2.0",
  "openpyxl>=3.1.0",
  "pyyaml>=6.0.2",
  "apscheduler>=3.10.4",
  "jinja2>=3.1.4",
  "pypdf>=5.0.0",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9.10"]
redis = ["redis>=5.2.0"]
sheets = ["gspread>=6.1.0", "google-auth>=2.36.0"]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
  "ruff>=0.8.0",
]

[project.scripts]
asda = "asda.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["asda*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
